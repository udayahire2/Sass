<svg width="100%" height="100%" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --logo-back: hsl(262.1, 83.3%, 57.8%);
      --logo-front: hsl(263.4, 70%, 50.4%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-back: hsl(263.4, 70%, 50.4%);
        --logo-front: hsl(262.1, 83.3%, 57.8%);
      }
    }
    .back { fill: var(--logo-back); }
    .front { fill: var(--logo-front); }
  </style>
  <rect x="2" y="2" width="26" height="36" rx="8" class="back" />
  <rect x="12" y="2" width="26" height="36" rx="8" class="front" />
</svg>
